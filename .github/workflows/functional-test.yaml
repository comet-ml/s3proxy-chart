name: Functional Test (kind)

# Installs the chart into an ephemeral kind cluster (thrown away with the runner)
# alongside lightweight mock backends, then performs a real S3 round-trip through
# s3proxy. Public repo → GitHub-hosted runner + kind, no cluster credentials, so
# it is safe to run on every PR (including forks).
#
# Backend coverage (all HARD GATES):
#   s3                      -> MinIO mock, full S3 round-trip.
#   filesystem / transient  -> install + round-trip. The chart emits placeholder
#                              jclouds.identity/jclouds.credential for local
#                              backends, so s3proxy starts and serves.
#   azureblob               -> Azurite mock, full round-trip through the fixed
#                              jclouds.endpoint (provider-agnostic).
#   azureblob-existing-secret -> Azurite mock, account key delivered via a
#                              pre-created Secret (key.existingSecret path, GH #34).
#   azureblob-managed-identity -> keyless Azure: managedIdentity renders empty
#                              identity/credential, so the Azure SDK's
#                              DefaultAzureCredential fetches a token from a stub
#                              managed-identity endpoint and S3Proxy presents it to
#                              Azurite (--oauth basic, HTTPS). Azurite rejects
#                              anonymous requests, so only the token path passes.
#   gcs                     -> fake-gcs-server mock through googleCloudStorage.endpoint,
#                              full round-trip. No key: the emulator accepts the
#                              unauthenticated requests the GCS SDK sends without one.
#   multi-backend           -> s3 (MinIO) + azureblob (Azurite) + filesystem (PVC)
#                              in ONE release, with per-backend bucket-locator
#                              routing. assert-routing.sh writes one bucket per
#                              backend through s3proxy and verifies each object
#                              physically lands on its intended backend (MinIO for
#                              s3, Azurite for azureblob, filesystem by elimination)
#                              and that no bucket leaks into another backend.
#   tls                     -> native in-pod HTTPS. A self-signed PKCS12 keystore is
#                              generated and stored in a Secret; s3proxy is installed
#                              with config.tls (existingSecret path) over filesystem,
#                              then the smoke test round-trips over HTTPS.
# openstack-swift is render-only (lint-render + helm-diff); an openstackswift/saio leg
# is possible but not added yet. Auth paths no emulator verifies stay render-only too:
# the GCS service-account key, Azure SAS, and S3 keyless.

on:
  pull_request:
    branches:
      - main
    paths:
      - charts/s3proxy/**
      - ci/functional/**
      - test-values/**
      - .github/workflows/functional-test.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    name: functional (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: s3
            values: ci/functional/values/s3.yaml
            mock: ci/functional/mocks/minio.yaml
          - backend: filesystem
            values: ci/functional/values/filesystem.yaml
          - backend: transient
            values: ci/functional/values/transient.yaml
          - backend: auth-existing-secret
            values: ci/functional/values/auth-existing-secret.yaml
            authSecret: true
          - backend: azureblob
            values: ci/functional/values/azureblob.yaml
            mock: ci/functional/mocks/azurite.yaml
          - backend: azureblob-existing-secret
            values: ci/functional/values/azureblob-existing-secret.yaml
            mock: ci/functional/mocks/azurite.yaml
            azureKeySecret: true
          - backend: azureblob-managed-identity
            values: ci/functional/values/azureblob-managed-identity.yaml
            mock: ci/functional/mocks/azurite-oauth.yaml ci/functional/mocks/azure-token-stub.yaml
            azuriteOAuth: true
          - backend: gcs
            values: ci/functional/values/gcs.yaml
            mock: ci/functional/mocks/fake-gcs-server.yaml
          - backend: multi-backend
            values: ci/functional/values/multi-backend.yaml
            mock: ci/functional/mocks/minio.yaml ci/functional/mocks/azurite.yaml
            verify: routing
          - backend: tls
            values: ci/functional/values/tls.yaml
            tls: true
            scheme: https
    env:
      NAMESPACE: s3proxy-test
      RELEASE: s3proxy
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.2

      - name: Build chart dependencies
        # comet-common is not vendored in-repo; resolve it from Chart.lock
        # (anonymous OCI pull, no auth needed).
        run: helm dependency build charts/s3proxy

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Create namespace
        run: kubectl create namespace "${NAMESPACE}"

      - name: Generate self-signed TLS keystore Secret (tls leg)
        if: matrix.tls
        # Build a self-signed PKCS12 keystore + password and store both in the
        # Secret the chart references via config.tls.*.existingSecret. Exercises the
        # production existingSecret path (also how cert-manager delivers a keystore).
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/tls.key -out /tmp/tls.crt -subj "/CN=s3proxy"
          openssl pkcs12 -export \
            -inkey /tmp/tls.key -in /tmp/tls.crt \
            -out /tmp/keystore.p12 -passout pass:changeit
          kubectl -n "${NAMESPACE}" create secret generic s3proxy-tls \
            --from-file=keystore.p12=/tmp/keystore.p12 \
            --from-literal=keystore-password=changeit

      - name: Generate Azurite TLS and S3Proxy truststore Secrets (managed-identity leg)
        if: matrix.azuriteOAuth
        # Azurite serves bearer-token auth over HTTPS only, and the Azure SDK sends
        # tokens over HTTPS only, so Azurite gets a self-signed cert for its Service
        # name and the S3Proxy JVM trusts it through a PKCS12 truststore.
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/azurite.key -out /tmp/azurite.crt \
            -subj "/CN=azurite" -addext "subjectAltName=DNS:azurite"
          "${JAVA_HOME}/bin/keytool" -importcert -noprompt -alias azurite \
            -file /tmp/azurite.crt -keystore /tmp/truststore \
            -storetype PKCS12 -storepass changeit
          kubectl -n "${NAMESPACE}" create secret tls azurite-tls \
            --cert=/tmp/azurite.crt --key=/tmp/azurite.key
          kubectl -n "${NAMESPACE}" create secret generic s3proxy-truststore \
            --from-file=truststore=/tmp/truststore

      - name: Create client auth Secret (auth existingSecret leg)
        if: matrix.authSecret
        # The identity/secret the smoke test signs with, in the Secret the chart
        # references via config.auth.existingSecret. Broken wiring leaves
        # s3proxy.identity/credential unset and the round-trip fails to authenticate.
        run: |
          kubectl -n "${NAMESPACE}" create secret generic s3proxy-auth \
            --from-literal=accessKeyId='test-access-key' \
            --from-literal=secretAccessKey='test-secret-key'

      - name: Create Azure Blob key Secret (existingSecret leg)
        if: matrix.azureKeySecret
        # Azurite's devstoreaccount1 key in the Secret the chart references via
        # azureblob.key.existingSecret (GH #34).
        run: |
          kubectl -n "${NAMESPACE}" create secret generic s3proxy-azureblob-key \
            --from-literal=accountKey='Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=='

      - name: Deploy mock backends (${{ matrix.backend }})
        if: matrix.mock
        # matrix.mock is a space-separated list of manifests (multi-backend
        # scenarios deploy several mocks).
        run: |
          for mock in ${{ matrix.mock }}
          do
            kubectl apply -n "${NAMESPACE}" -f "${mock}"
          done
          kubectl -n "${NAMESPACE}" wait --for=condition=Available deploy --all --timeout=180s

      - name: Install s3proxy
        run: |
          helm upgrade --install "${RELEASE}" charts/s3proxy \
            -n "${NAMESPACE}" \
            --values "${{ matrix.values }}" \
            --wait --timeout 5m

      - name: Verify (${{ matrix.verify || 'round-trip' }})
        # Single-backend legs: one S3 round-trip through s3proxy (over matrix.scheme,
        # default http; the tls leg sets https).
        # multi-backend leg (verify=routing): assert each bucket physically lands
        # on its intended backend (needs aws + az; both are on ubuntu-latest).
        run: |
          if [ "${{ matrix.verify }}" = "routing" ]
          then
            chmod +x ci/functional/assert-routing.sh
            ci/functional/assert-routing.sh "${RELEASE}" "${NAMESPACE}"
          else
            chmod +x ci/functional/smoke-test.sh
            ci/functional/smoke-test.sh "${RELEASE}" "${NAMESPACE}" 9000 test-access-key test-secret-key smoke "${{ matrix.scheme || 'http' }}"
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get all || true
          kubectl -n "${NAMESPACE}" describe pods || true
          kubectl -n "${NAMESPACE}" logs -l app.kubernetes.io/name=s3proxy --all-containers --tail=300 || true
          kubectl -n "${NAMESPACE}" logs -l app --all-containers --prefix --tail=100 || true
          kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp || true
