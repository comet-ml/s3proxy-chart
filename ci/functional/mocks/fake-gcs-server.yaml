# fake-gcs-server: Google Cloud Storage emulator for the s3proxy functional test
# (the emulator S3Proxy's own CI runs its GCS lane against).
# Ephemeral (in-memory backend); the whole kind cluster is discarded after the test.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-gcs
  labels:
    app: fake-gcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-gcs
  template:
    metadata:
      labels:
        app: fake-gcs
    spec:
      # The fake-gcs Service would inject FAKE_GCS_PORT=tcp://<ip>:4443, which
      # fake-gcs-server reads as its own port setting and exits on.
      enableServiceLinks: false
      containers:
        - name: fake-gcs
          image: fsouza/fake-gcs-server:1.56.1
          args:
            - -scheme
            - http
            - -port
            - "4443"
            - -backend
            - memory
            # Upload responses carry URLs back to the server, so they must name
            # the Service rather than the pod's own host.
            - -external-url
            - http://fake-gcs:4443
            - -public-host
            - fake-gcs:4443
          ports:
            - name: gcs
              containerPort: 4443
          readinessProbe:
            httpGet:
              path: /_internal/healthcheck
              port: 4443
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fake-gcs
  labels:
    app: fake-gcs
spec:
  selector:
    app: fake-gcs
  ports:
    - name: gcs
      port: 4443
      targetPort: 4443
