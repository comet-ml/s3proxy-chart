# Managed-identity token stub for the azureblob-managed-identity functional leg.
# S3Proxy gets IDENTITY_ENDPOINT/IDENTITY_HEADER (the App Service managed-identity
# contract), so DefaultAzureCredential fetches its token here. The token is an
# unsigned JWT: Azurite's --oauth basic checks issuer, audience and lifetime but
# not the signature.
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-token
data:
  token_stub.py: |
    import base64
    import json
    import time
    from http.server import BaseHTTPRequestHandler, HTTPServer


    def b64(obj):
        return base64.urlsafe_b64encode(json.dumps(obj).encode()).rstrip(b"=").decode()


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            now = int(time.time())
            claims = {
                "aud": "https://storage.azure.com",
                "iss": "https://sts.windows.net/00000000-0000-0000-0000-000000000000/",
                "iat": now - 60,
                "nbf": now - 60,
                "exp": now + 3600,
            }
            token = f'{b64({"alg": "none", "typ": "JWT"})}.{b64(claims)}.'
            body = json.dumps({
                "access_token": token,
                "expires_on": str(now + 3600),
                "resource": "https://storage.azure.com",
                "token_type": "Bearer",
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)


    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-token
  labels:
    app: azure-token
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-token
  template:
    metadata:
      labels:
        app: azure-token
    spec:
      containers:
        - name: azure-token
          image: python:3.13-alpine
          command: ["python", "-u", "/stub/token_stub.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: stub
              mountPath: /stub
      volumes:
        - name: stub
          configMap:
            name: azure-token
---
apiVersion: v1
kind: Service
metadata:
  name: azure-token
  labels:
    app: azure-token
spec:
  selector:
    app: azure-token
  ports:
    - name: http
      port: 8080
      targetPort: 8080
