# Default values for s3proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of S3Proxy replicas
replicaCount: 1

image:
  # -- S3Proxy image repository
  repository: andrewgaul/s3proxy
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

configMergeImage:
  # -- Config merge container image repository
  repository: busybox
  # -- Config merge container image pull policy
  pullPolicy: IfNotPresent
  # -- Config merge container image tag
  tag: "1.36"

# -- Image pull secrets
imagePullSecrets: []
# -- String to partially override s3proxy.fullname template
nameOverride: ""
# -- String to fully override s3proxy.fullname template
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Extra labels to add to the pod (merged with the chart's selector labels)
podLabels: {}

# -- Pod security context
podSecurityContext: {}

# -- Container security context
securityContext: {}

# -- Pod termination grace period. Covers the 5s preStop sleep plus the in-flight request drain (up to 30s) that S3Proxy releases after 3.3.0 perform on SIGTERM.
terminationGracePeriodSeconds: 40

service:
  # -- Kubernetes service type
  type: ClusterIP
  # -- Service port
  port: 9000
  # -- Target port (controls both the container port and S3Proxy bind port)
  targetPort: 9000
  # -- Service annotations
  annotations: {}

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts configuration
  hosts: []
  #  - host: chart-example.local
  #    paths:
  #      - path: /
  #        pathType: ImplementationSpecific
  # -- TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Resource limits and requests
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  # -- Enable HPA
  enabled: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 100
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node selector for pod assignment
nodeSelector: {}

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity for pod assignment
affinity: {}

config:
  # -- Log level for S3Proxy (DEBUG, INFO, WARN, ERROR)
  logLevel: "INFO"

  auth:
    # -- Authorization type (none, aws-v2, aws-v4, aws-v2-or-v4)
    type: "aws-v4"
    # -- S3 Access Key ID for client authentication, stored in the chart-owned Secret. Ignored when `existingSecret` is set.
    identity: ""
    # -- S3 Secret Access Key for client authentication, stored in the chart-owned Secret. Ignored when `existingSecret` is set.
    secret: ""
    # -- Name of an existing Secret holding both client authentication credentials (see `identityKey`/`secretKey`). Takes precedence over `identity`/`secret`, which are otherwise stored in plaintext in the chart-owned Secret; prefer this when the values file lives in Git.
    existingSecret: ""
    # -- Key within `existingSecret` that holds the S3 Access Key ID
    identityKey: "accessKeyId"
    # -- Key within `existingSecret` that holds the S3 Secret Access Key
    secretKey: "secretAccessKey"

  tls:
    # -- Enable native in-pod HTTPS (S3Proxy `secure-endpoint`). When enabled, S3Proxy serves HTTPS only on `service.targetPort` (the plaintext endpoint is not bound), so TLS is terminated in the pod rather than at the ingress. Requires a PKCS12 (or JKS) keystore and its password. `tcpSocket` health probes are unaffected (they do not perform a TLS handshake).
    enabled: false
    keystore:
      # -- Name of an existing Secret holding the keystore file (binary PKCS12/JKS). Takes precedence over `value`. Use this for a customer-provided keystore or a cert-manager-issued one (`Certificate.spec.keystores.pkcs12`).
      existingSecret: ""
      # -- Key within `keystore.existingSecret` (or, when `value` is used, within the chart's own Secret) that holds the keystore file
      secretKey: "keystore.p12"
      # -- (string) Inline base64-encoded keystore, stored in the chart's own Secret and mounted as a file. Used only when `keystore.existingSecret` is empty. Convenient for testing; prefer `existingSecret` in production.
      value: ""
    keystorePassword:
      # -- Name of an existing Secret holding the keystore password. Takes precedence over `value`.
      existingSecret: ""
      # -- Key within `keystorePassword.existingSecret` that holds the keystore password
      secretKey: "keystore-password"
      # -- Inline keystore password, stored in the chart's own Secret and merged into the backend properties by the secret-merge initContainer (kept out of the ConfigMap). Used only when `keystorePassword.existingSecret` is empty.
      value: ""

  # -- Virtual Host configuration
  virtualHost: ""

  cors:
    # -- Enable CORS support
    enabled: false
    # -- Allowed origins (e.g., ["https://example.com", "https://.+\\.example\\.com"])
    allowOrigins: []
    # -- Allowed methods
    allowMethods: ["GET", "PUT", "POST", "HEAD", "DELETE"]
    # -- Allowed headers
    allowHeaders: ["Accept", "Content-Type"]
    # -- Allow credentials
    allowCredential: false

  buckets:
    # -- Map virtual bucket names to actual backend buckets
    alias: {}
      # example-bucket: "real-bucket-name"

    # Bucket-to-backend routing is configured PER BACKEND via
    # config.backends.<name>.bucketLocators. S3Proxy reads bucket-locators from
    # each backend's own properties file, so a single global list would route
    # every bucket to only the first backend.

  middlewares:
    # -- Make backend read-only
    readOnly: false
    # -- Enable eventual consistency modeling
    eventualConsistency: false
    # -- Enable sharded backend containers
    shardedBackend: false
    # -- Enable large object mocking
    largeObjectMocking: false

  backends:
    filesystem:
      # -- Enable filesystem backend (provider `filesystem`, NIO2-backed in S3Proxy 4.x)
      enabled: true
      # -- Base directory for filesystem backend
      basedir: "/data/s3proxy"
      # -- jclouds identity placeholder. S3Proxy requires jclouds.identity in every backend properties file; the filesystem backend ignores the value. An empty value falls back to "local".
      identity: "local"
      # -- jclouds credential placeholder. S3Proxy requires jclouds.credential in every backend properties file; the filesystem backend ignores the value. An empty value falls back to "local".
      credential: "local"
      # -- Buckets routed to this backend (S3Proxy bucket-locator; glob patterns supported). Only relevant when multiple backends are enabled; a bucket matching no backend's list falls through to the first-enabled backend.
      bucketLocators: []

    transient:
      # -- Enable transient (in-memory) backend (provider `transient`, NIO2-backed in S3Proxy 4.x)
      enabled: false
      # -- jclouds identity placeholder. S3Proxy requires jclouds.identity in every backend properties file; the transient backend ignores the value. An empty value falls back to "local".
      identity: "local"
      # -- jclouds credential placeholder. S3Proxy requires jclouds.credential in every backend properties file; the transient backend ignores the value. An empty value falls back to "local".
      credential: "local"
      # -- Buckets routed to this backend (S3Proxy bucket-locator; glob patterns supported). Only relevant when multiple backends are enabled; a bucket matching no backend's list falls through to the first-enabled backend.
      bucketLocators: []

    s3:
      # -- Enable S3 backend (provider `aws-s3`, AWS SDK; also serves S3-compatible endpoints such as MinIO/Ceph via `endpoint`)
      enabled: false
      # -- AWS region (`jclouds.region`). S3Proxy defaults to `us-east-1` when empty.
      region: ""
      # -- S3 endpoint (`jclouds.endpoint`) for an S3-compatible backend (MinIO, Ceph). Leave empty for AWS.
      endpoint: ""
      # -- Use ambient/keyless credentials: leave `accessKeyID`/`secretAccessKey` empty and the AWS SDK default credential chain resolves IRSA / EKS Pod Identity / EC2 instance-profile creds. Mutually exclusive with `accessKeyID`/`secretAccessKey.*`.
      keyless: false
      # -- S3 Access Key ID for backend (`jclouds.identity`). Leave empty when `keyless: true`.
      accessKeyID: ""
      # -- S3 Secret Access Key configuration. Leave empty when `keyless: true`.
      secretAccessKey:
        # -- Secret access key value
        value: ""
        # -- Name of existing secret containing the secret access key
        existingSecret: ""
        # -- Key in the existing secret containing the secret access key
        secretKey: "secretAccessKey"
      # -- Buckets routed to this backend (S3Proxy bucket-locator; glob patterns supported). Only relevant when multiple backends are enabled; a bucket matching no backend's list falls through to the first-enabled backend.
      bucketLocators: []

    azureblob:
      # -- Enable Azure Blob Storage backend (provider `azureblob`, Azure SDK)
      enabled: false
      # -- Use Azure Managed/Workload Identity instead of a static account key or SAS token. Mutually exclusive with `key.*` and `sasToken.*`. When true the chart renders both `jclouds.identity` and `jclouds.credential` empty, which makes the Azure SDK fall back to `DefaultAzureCredential` (consuming the AKS workload-identity env `AZURE_CLIENT_ID`/`AZURE_TENANT_ID`/`AZURE_FEDERATED_TOKEN_FILE`). Set `account` (or `endpoint`) for the storage endpoint, annotate the ServiceAccount with `azure.workload.identity/client-id` (`serviceAccount.annotations`) and label the pod `azure.workload.identity/use: "true"` (`podLabels`).
      managedIdentity: false
      # -- Storage account name
      account: ""
      # -- Storage account key configuration
      key:
        # -- Storage account key value
        value: ""
        # -- Name of existing secret containing the storage account key
        existingSecret: ""
        # -- Key in the existing secret containing the storage account key
        secretKey: "accountKey"
      # -- (string) Azure endpoint
      # @default -- `https://{{ .Values.config.backends.azureblob.account }}.blob.core.windows.net`
      endpoint:
      # -- SAS token configuration
      sasToken:
        # -- SAS token value
        value: ""
        # -- Name of existing secret containing the SAS token
        existingSecret: ""
        # -- Key in the existing secret containing the SAS token
        secretKey: "sasToken"
      # -- Buckets routed to this backend (S3Proxy bucket-locator; glob patterns supported). Only relevant when multiple backends are enabled; a bucket matching no backend's list falls through to the first-enabled backend.
      bucketLocators: []

    googleCloudStorage:
      # -- Enable Google Cloud Storage backend (provider `google-cloud-storage`, Google SDK)
      enabled: false
      # -- GCP project ID, emitted as `jclouds.identity` (the GCS SDK store reads it as the project id). Optional: when empty the project is taken from the service-account key.
      projectID: ""
      # -- Service-account key configuration. The full JSON key is passed to the GCS SDK as `jclouds.credential` (`ServiceAccountCredentials.fromStream`). NOTE: S3Proxy 4.x does NOT support keyless GCS (Workload Identity/ADC) — an empty credential selects an unauthenticated (emulator-only) client, not ADC — so a static key is required against real GCS.
      serviceAccountKey:
        # -- (string) Inline service-account JSON key content, stored in the chart-owned Secret and mounted as a file the initContainer merges into the backend properties (kept out of the ConfigMap). Used only when `existingSecret` is empty.
        value: ""
        # -- Name of an existing Secret holding the service-account JSON key
        existingSecret: ""
        # -- Key within the Secret that holds the JSON key
        secretKey: "key.json"
      # -- Buckets routed to this backend (S3Proxy bucket-locator; glob patterns supported). Only relevant when multiple backends are enabled; a bucket matching no backend's list falls through to the first-enabled backend.
      bucketLocators: []

    openstackSwift:
      # -- Enable OpenStack Swift backend (provider `openstack-swift`, openstack4j SDK, Keystone v3)
      enabled: false
      # -- Keystone authentication URL (`jclouds.endpoint`)
      authURL: ""
      # -- Username (`jclouds.identity`)
      userName: ""
      # -- Password configuration
      password:
        # -- Password value
        value: ""
        # -- Name of existing secret containing the password
        existingSecret: ""
        # -- Key in the existing secret containing the password
        secretKey: "password"
      # -- Keystone project (tenant) name to scope the token to (`openstack-swift-sdk.project-name`). Required: Swift is only reachable through a project-scoped token.
      projectName: ""
      # -- Keystone domain that owns the project (`openstack-swift-sdk.project-domain-name`)
      projectDomainName: "Default"
      # -- Keystone domain that owns the user (`openstack-swift-sdk.user-domain-name`)
      userDomainName: "Default"
      # -- Region to select from the service catalog (`openstack-swift-sdk.region`); empty selects the first/default region
      region: ""
      # -- Buckets routed to this backend (S3Proxy bucket-locator; glob patterns supported). Only relevant when multiple backends are enabled; a bucket matching no backend's list falls through to the first-enabled backend.
      bucketLocators: []

persistence:
  # -- Enable persistence using PVC
  enabled: true
  # -- PVC Access Mode
  accessMode: ReadWriteOnce
  # -- PVC Storage Request
  size: 10Gi
  # -- Storage Class
  # @default -- `""` (uses default StorageClass)
  storageClass: ""
  # -- Use existing PVC
  existingClaim: ""
  # -- PVC annotations
  annotations: {}

# -- Additional environment variables
extraEnvVars: []
  # - name: EXAMPLE_VAR
  #   value: "example-value"

# -- Additional volume mounts
extraVolumeMounts: []
  # - name: extra-volume
  #   mountPath: /extra

# -- Additional volumes
extraVolumes: []
  # - name: extra-volume
  #   emptyDir: {}
