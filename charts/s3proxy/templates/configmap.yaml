{{- define "s3proxy.main.config" -}}
# S3Proxy configuration
  {{- if .Values.config.tls.enabled }}
# Native TLS: S3Proxy terminates HTTPS in the pod (secure-endpoint only; no
# plaintext endpoint is bound). The keystore password is not emitted here; it is
# merged in from the Secret by the merge-configs initContainer.
s3proxy.secure-endpoint=https://0.0.0.0:{{ .Values.service.targetPort }}
s3proxy.keystore-path=/tls/keystore.p12
  {{- else }}
s3proxy.endpoint=http://0.0.0.0:{{ .Values.service.targetPort }}
  {{- end }}
s3proxy.authorization={{ .Values.config.auth.type }}
  {{- if .Values.config.virtualHost }}
s3proxy.virtual-host={{ .Values.config.virtualHost }}
  {{- end }}

  {{- if ne .Values.config.auth.type "none" }}
# Authentication credentials will be merged from the secret properties file
# s3proxy.identity and s3proxy.credential will be provided by the secret
  {{- end }}

  {{- if .Values.config.cors.enabled }}
# CORS configuration
    {{- if .Values.config.cors.allowOrigins }}
s3proxy.cors-allow-origins={{ join " " .Values.config.cors.allowOrigins }}
    {{- end }}
    {{- if .Values.config.cors.allowMethods }}
s3proxy.cors-allow-methods={{ join " " .Values.config.cors.allowMethods }}
    {{- end }}
    {{- if .Values.config.cors.allowHeaders }}
s3proxy.cors-allow-headers={{ join " " .Values.config.cors.allowHeaders }}
    {{- end }}
s3proxy.cors-allow-credential={{ .Values.config.cors.allowCredential }}
  {{- end }}

  {{- if .Values.config.buckets.alias }}
# Bucket aliasing
    {{- range $key, $value := .Values.config.buckets.alias }}
s3proxy.alias.{{ $key }}={{ $value }}
    {{- end }}
  {{- end }}

  {{- /* Bucket locators are per-backend: each backend's properties file lists
         the buckets it owns (see config.backends.<name>.bucketLocators). They are
         intentionally NOT emitted here in the shared config, because S3Proxy
         de-duplicates locators across --properties files (first file wins), so a
         shared list would route every bucket to only the first backend. */}}

  {{- if .Values.config.middlewares.readOnly }}
# Read-only middleware
s3proxy.read-only-blobstore=true
  {{- end }}

  {{- if .Values.config.middlewares.eventualConsistency }}
# Eventual consistency middleware
s3proxy.eventual-consistency=true
  {{- end }}

  {{- if .Values.config.middlewares.shardedBackend }}
# Sharded backend middleware
s3proxy.sharded-blobstore=true
s3proxy.sharded-blobstore.prefix=2
s3proxy.sharded-blobstore.levels=2
  {{- end }}

  {{- if .Values.config.middlewares.largeObjectMocking }}
# Large object mocking middleware
s3proxy.large-object-mocking=true
  {{- end }}
{{- end }}
{{- /*
  Version guard: this chart (1.x) targets S3Proxy 4.x, which removed Apache jclouds
  and, with it, the Atmos/B2 backends and the -sdk/-nio2 provider name variants (the
  short names are now canonical). Rendered configs are therefore not valid on 3.x, so
  fail if the effective S3Proxy version (image.tag, else appVersion) parses as semver
  and is older than 4.0.0. Non-semver tags (master, sha-*) are not version-checked.
  Chart 0.x remains the line for S3Proxy 3.x.
*/}}
{{- $s3pVersion := .Values.image.tag | default .Chart.AppVersion -}}
{{- if regexMatch "^v?[0-9]+\\.[0-9]+\\.[0-9]+" $s3pVersion }}
  {{- if semverCompare "< 4.0.0" (trimPrefix "v" $s3pVersion) }}
    {{- fail (printf "s3proxy-chart %s targets S3Proxy >= 4.0.0 (jclouds removed in 4.0.0), but the effective S3Proxy version is %s. Bump image.tag to >= 4.0.0, or use chart 0.x for S3Proxy 3.x. See the chart README 'S3Proxy version compatibility' notes." $.Chart.Version $s3pVersion) }}
  {{- end }}
{{- end }}
{{- /* Fail fast on an Azure managed-identity config that can't authenticate, since
       the failure otherwise surfaces only at runtime as an opaque Azure SDK error. */}}
{{- if and .Values.config.backends.azureblob.enabled .Values.config.backends.azureblob.managedIdentity }}
  {{- if or .Values.config.backends.azureblob.key.value .Values.config.backends.azureblob.key.existingSecret .Values.config.backends.azureblob.sasToken.value .Values.config.backends.azureblob.sasToken.existingSecret }}
    {{- fail "config.backends.azureblob.managedIdentity conflicts with a static credential; a non-empty key.*/sasToken.* disables DefaultAzureCredential. Unset them." }}
  {{- end }}
  {{- if and (not .Values.config.backends.azureblob.account) (not .Values.config.backends.azureblob.endpoint) }}
    {{- fail "config.backends.azureblob.managedIdentity needs the storage endpoint; set config.backends.azureblob.account (default endpoint) or endpoint." }}
  {{- end }}
{{- end }}
{{- /* Same fail-fast for S3 keyless: an ambient-credentials config must not also
       carry a static key, which would override the AWS default credential chain. */}}
{{- if and .Values.config.backends.s3.enabled .Values.config.backends.s3.keyless }}
  {{- if or .Values.config.backends.s3.accessKeyID .Values.config.backends.s3.secretAccessKey.value .Values.config.backends.s3.secretAccessKey.existingSecret }}
    {{- fail "config.backends.s3.keyless conflicts with a static credential; a non-empty accessKeyID/secretAccessKey.* disables the AWS default credential chain. Unset them." }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "comet-common.names.fullname" . }}
  labels:
    {{- include "comet-common.labels.base" . | nindent 4 }}
data:
{{- if .Values.config.backends.filesystem.enabled }}
  backend-filesystem.properties: |-
    {{- include "s3proxy.main.config" . | nindent 4 }}

    # Filesystem backend configuration (NIO2-backed in S3Proxy 4.x)
    jclouds.provider=filesystem
    jclouds.filesystem.basedir={{ .Values.config.backends.filesystem.basedir }}
    # S3Proxy requires jclouds.identity and jclouds.credential in every backend
    # properties file, even for local backends where the values are unused.
    jclouds.identity={{ .Values.config.backends.filesystem.identity | default "local" }}
    jclouds.credential={{ .Values.config.backends.filesystem.credential | default "local" }}
  {{- range $index, $bucket := .Values.config.backends.filesystem.bucketLocators }}
    s3proxy.bucket-locator.{{ add $index 1 }}={{ $bucket }}
  {{- end }}
{{- end }}

{{- if .Values.config.backends.transient.enabled }}
  backend-transient.properties: |-
    {{- include "s3proxy.main.config" . | nindent 4 }}

    # Transient backend configuration (NIO2-backed in S3Proxy 4.x)
    jclouds.provider=transient
    # S3Proxy requires jclouds.identity and jclouds.credential in every backend
    # properties file, even for local backends where the values are unused.
    jclouds.identity={{ .Values.config.backends.transient.identity | default "local" }}
    jclouds.credential={{ .Values.config.backends.transient.credential | default "local" }}
  {{- range $index, $bucket := .Values.config.backends.transient.bucketLocators }}
    s3proxy.bucket-locator.{{ add $index 1 }}={{ $bucket }}
  {{- end }}
{{- end }}

{{- if .Values.config.backends.s3.enabled }}
  backend-s3.properties: |-
    {{- include "s3proxy.main.config" . | nindent 4 }}

    # S3 backend configuration (aws-s3 provider, AWS SDK; also serves S3-compatible
    # endpoints such as MinIO/Ceph via jclouds.endpoint).
    jclouds.provider=aws-s3
  {{- if .Values.config.backends.s3.region }}
    jclouds.region={{ .Values.config.backends.s3.region }}
  {{- end }}
  {{- if .Values.config.backends.s3.endpoint }}
    jclouds.endpoint={{ .Values.config.backends.s3.endpoint }}
  {{- end }}
  {{- if .Values.config.backends.s3.keyless }}
    # Keyless: empty identity/credential make the AWS SDK resolve credentials from
    # its default provider chain (IRSA / EKS Pod Identity / EC2 instance profile).
    jclouds.identity=
    jclouds.credential=
  {{- else }}
    {{- if .Values.config.backends.s3.accessKeyID }}
    jclouds.identity={{ .Values.config.backends.s3.accessKeyID }}
    {{- end }}
    {{- if .Values.config.backends.s3.secretAccessKey.value }}
    # Credential will be merged from the secret properties file
    {{- end }}
  {{- end }}
  {{- range $index, $bucket := .Values.config.backends.s3.bucketLocators }}
    s3proxy.bucket-locator.{{ add $index 1 }}={{ $bucket }}
  {{- end }}
{{- end }}

{{- if .Values.config.backends.azureblob.enabled }}
  backend-azureblob.properties: |-
    {{- include "s3proxy.main.config" . | nindent 4 }}

    # Azure Blob backend configuration (azureblob provider, Azure SDK)
    jclouds.provider=azureblob
  {{- if or .Values.config.backends.azureblob.endpoint .Values.config.backends.azureblob.account }}
    jclouds.endpoint={{ .Values.config.backends.azureblob.endpoint | default (printf "https://%s.blob.core.windows.net" .Values.config.backends.azureblob.account) }}
  {{- end }}
  {{- if .Values.config.backends.azureblob.managedIdentity }}
    # Managed/Workload Identity: the Azure SDK falls back to DefaultAzureCredential
    # (reads the AKS-injected AZURE_CLIENT_ID/TENANT_ID/FEDERATED_TOKEN_FILE) only
    # when BOTH identity and credential are empty. The account name lives in
    # jclouds.endpoint above, never in the identity.
    jclouds.identity=
    jclouds.credential=
  {{- else }}
    {{- if .Values.config.backends.azureblob.account }}
    jclouds.identity={{ .Values.config.backends.azureblob.account }}
    {{- end }}
    {{- /* With a key (key.value or key.existingSecret) the initContainer merges
           jclouds.credential in from a Secret. S3Proxy requires the property in every
           backend file, so emit it empty when neither is set (SAS-token auth). */}}
    {{- if and (not .Values.config.backends.azureblob.key.value) (not .Values.config.backends.azureblob.key.existingSecret) }}
    jclouds.credential=
    {{- end }}
  {{- end }}
  {{- range $index, $bucket := .Values.config.backends.azureblob.bucketLocators }}
    s3proxy.bucket-locator.{{ add $index 1 }}={{ $bucket }}
  {{- end }}
{{- end }}

{{- if .Values.config.backends.googleCloudStorage.enabled }}
  backend-google-cloud-storage.properties: |-
    {{- include "s3proxy.main.config" . | nindent 4 }}

    # Google Cloud Storage backend configuration (google-cloud-storage provider,
    # Google SDK).
    jclouds.provider=google-cloud-storage
  {{- if .Values.config.backends.googleCloudStorage.projectID }}
    # The GCS SDK store reads jclouds.identity as the GCP project id (setProjectId).
    jclouds.identity={{ .Values.config.backends.googleCloudStorage.projectID }}
  {{- end }}
  {{- if .Values.config.backends.googleCloudStorage.endpoint }}
    jclouds.endpoint={{ .Values.config.backends.googleCloudStorage.endpoint }}
  {{- end }}
    # jclouds.credential (the full service-account JSON key) is merged in by the
    # merge-configs initContainer from the mounted key file, so the multi-line JSON
    # is escaped to a single properties value and kept out of the ConfigMap. With no
    # key the SDK uses an unauthenticated client (emulator only) — S3Proxy 4.x does
    # NOT support keyless GCS (Workload Identity/ADC); real GCS needs a static key.
  {{- range $index, $bucket := .Values.config.backends.googleCloudStorage.bucketLocators }}
    s3proxy.bucket-locator.{{ add $index 1 }}={{ $bucket }}
  {{- end }}
{{- end }}

{{- if .Values.config.backends.openstackSwift.enabled }}
  backend-openstack-swift.properties: |-
    {{- include "s3proxy.main.config" . | nindent 4 }}

    # OpenStack Swift backend configuration (openstack-swift provider, openstack4j
    # SDK, Keystone v3).
    jclouds.provider=openstack-swift
  {{- if .Values.config.backends.openstackSwift.authURL }}
    jclouds.endpoint={{ .Values.config.backends.openstackSwift.authURL }}
  {{- end }}
  {{- if .Values.config.backends.openstackSwift.userName }}
    jclouds.identity={{ .Values.config.backends.openstackSwift.userName }}
  {{- end }}
  {{- if .Values.config.backends.openstackSwift.password.value }}
    # Credential will be merged from the secret properties file
  {{- end }}
  {{- if .Values.config.backends.openstackSwift.projectName }}
    openstack-swift-sdk.project-name={{ .Values.config.backends.openstackSwift.projectName }}
  {{- end }}
    openstack-swift-sdk.project-domain-name={{ .Values.config.backends.openstackSwift.projectDomainName | default "Default" }}
    openstack-swift-sdk.user-domain-name={{ .Values.config.backends.openstackSwift.userDomainName | default "Default" }}
  {{- if .Values.config.backends.openstackSwift.region }}
    openstack-swift-sdk.region={{ .Values.config.backends.openstackSwift.region }}
  {{- end }}
  {{- range $index, $bucket := .Values.config.backends.openstackSwift.bucketLocators }}
    s3proxy.bucket-locator.{{ add $index 1 }}={{ $bucket }}
  {{- end }}
{{- end }}
