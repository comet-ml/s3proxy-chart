apiVersion: v1
kind: Secret
metadata:
  name: {{ include "comet-common.names.fullname" . }}
  labels:
    {{- include "comet-common.labels.base" . | nindent 4 }}
type: Opaque
{{- if and .Values.config.tls.enabled .Values.config.tls.keystore.value (not .Values.config.tls.keystore.existingSecret) }}
data:
  # Inline TLS keystore (binary PKCS12/JKS), stored base64 exactly as provided in
  # config.tls.keystore.value. Mounted read-only at /tls/keystore.p12; never merged
  # into the text properties. Used only when keystore.existingSecret is empty.
  {{ .Values.config.tls.keystore.secretKey }}: {{ .Values.config.tls.keystore.value }}
{{- end }}
{{- with include "s3proxy.secret.stringData" . }}
stringData:
  # Sensitive properties merged into the backend properties files by the
  # merge-configs initContainer:
  #   * secret-common.properties  -> appended to EVERY backend file (client auth).
  #   * secret-<backend>.properties -> appended ONLY to that backend's file, so
  #     each backend gets its own jclouds.credential and never another backend's.
  # Local backends (filesystem/transient) need no secret file; their placeholder
  # jclouds.identity/credential come from the ConfigMap.
{{- . }}
{{- end }}

{{- /*
The stringData properties, captured so the key above is emitted only when non-empty
(with every credential coming from an existingSecret, or auth disabled, a bare
`stringData:` would render as null). Client auth from config.auth.existingSecret is
mounted at /auth-secret and merged by the initContainer instead of landing here.
*/}}
{{- define "s3proxy.secret.stringData" -}}
{{- $hasClientAuth := and .Values.config.auth.identity .Values.config.auth.secret (not .Values.config.auth.existingSecret) }}
{{- $inlineKeystorePassword := and .Values.config.tls.enabled .Values.config.tls.keystorePassword.value (not .Values.config.tls.keystorePassword.existingSecret) }}
{{- if or $hasClientAuth $inlineKeystorePassword }}
  secret-common.properties: |
  {{- if $hasClientAuth }}
    # S3Proxy client authentication credentials (shared by all backends)
    s3proxy.identity={{ .Values.config.auth.identity }}
    s3proxy.credential={{ .Values.config.auth.secret }}
  {{- end }}
  {{- if $inlineKeystorePassword }}
    # TLS keystore password (shared by all backends; kept out of the ConfigMap)
    s3proxy.keystore-password={{ .Values.config.tls.keystorePassword.value }}
  {{- end }}
{{- end }}
{{- if and .Values.config.backends.s3.enabled .Values.config.backends.s3.secretAccessKey.value }}
  secret-s3.properties: |
    # S3 backend credential
    jclouds.credential={{ .Values.config.backends.s3.secretAccessKey.value }}
{{- end }}
{{- if .Values.config.backends.azureblob.enabled }}
  {{- if or .Values.config.backends.azureblob.key.value .Values.config.backends.azureblob.sasToken.value }}
  secret-azureblob.properties: |
    # Azure Blob backend credentials
    {{- if .Values.config.backends.azureblob.key.value }}
    jclouds.credential={{ .Values.config.backends.azureblob.key.value }}
    {{- end }}
    {{- if .Values.config.backends.azureblob.sasToken.value }}
    # S3Proxy 4.x reads a SAS token as the backend session token.
    jclouds.session-token={{ .Values.config.backends.azureblob.sasToken.value }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if and .Values.config.backends.googleCloudStorage.enabled .Values.config.backends.googleCloudStorage.serviceAccountKey.value (not .Values.config.backends.googleCloudStorage.serviceAccountKey.existingSecret) }}
  # Full service-account JSON key. Mounted as a file and merged into the backend
  # properties (escaped to a single line) by the merge-configs initContainer, so the
  # multi-line JSON never lands in the ConfigMap or on a properties line here.
  gcs-key.json: |
    {{- .Values.config.backends.googleCloudStorage.serviceAccountKey.value | nindent 4 }}
{{- end }}
{{- if and .Values.config.backends.openstackSwift.enabled .Values.config.backends.openstackSwift.password.value }}
  secret-openstack-swift.properties: |
    # OpenStack Swift backend credential
    jclouds.credential={{ .Values.config.backends.openstackSwift.password.value }}
{{- end }}
{{- end }}
