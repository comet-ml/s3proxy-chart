# Render/lint scenario: Google Cloud Storage backend with an inline service-account
# JSON key. Exercises the secret.yaml gcs-key.json emission and the gcs-key volume
# + initContainer escape path (S3Proxy 4.x: the GCS SDK reads jclouds.credential as
# the JSON key content, so the multi-line key is merged in from the mounted file
# rather than referenced by path).
config:
  auth:
    type: aws-v4
    identity: test-access-key
    secret: test-secret-key
  backends:
    filesystem:
      enabled: false
    googleCloudStorage:
      enabled: true
      projectID: test-project
      serviceAccountKey:
        value: |
          {
            "type": "service_account",
            "project_id": "test-project",
            "private_key": "-----BEGIN PRIVATE KEY-----\nMIIBExample\n-----END PRIVATE KEY-----\n",
            "client_email": "s3proxy@test-project.iam.gserviceaccount.com"
          }
persistence:
  enabled: false
