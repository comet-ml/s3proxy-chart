# Render/lint scenario: OpenStack Swift backend (openstack-swift provider,
# openstack4j SDK, Keystone v3). Exercises the bare-username jclouds.identity and
# the openstack-swift-sdk.project-name / *-domain-name / region render.
config:
  auth:
    type: aws-v4
    identity: test-access-key
    secret: test-secret-key
  backends:
    filesystem:
      enabled: false
    openstackSwift:
      enabled: true
      authURL: https://auth.example.com/v3
      userName: test-user
      password:
        value: test-password
      projectName: test-project
      projectDomainName: Default
      userDomainName: Default
      region: RegionOne
persistence:
  enabled: false
